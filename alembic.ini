[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# 库连接从环境变量拼装（crm.config.build_dsn），此处留空即可：
#   CRM_DB_USER / CRM_DB_PASSWORD / CRM_DB_HOST / CRM_DB_PORT / CRM_DB_NAME
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
